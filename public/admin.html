<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>裁判控制台 - OWCS Admin</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* --- 基础布局 --- */
        body { background-color: #333; color: #333; }
        .admin-container { max-width: 1000px; margin: 2rem auto; padding: 25px; background: white; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        h1 { text-align: center; color: var(--accent-purple); margin-bottom: 30px; }
        .section-box { border: 2px solid #eee; padding: 20px; border-radius: 10px; margin-bottom: 25px; background: #fff; }
        .section-title { margin-top: 0; color: var(--accent-purple); border-bottom: 2px solid var(--primary-pink); padding-bottom: 10px; margin-bottom: 20px; font-size: 1.2rem; display: flex; align-items: center; gap: 10px; }
        
        /* --- 比赛列表 --- */
        .match-row { display: flex; justify-content: space-between; align-items: flex-start; padding: 15px 12px; border-bottom: 1px solid #eee; transition: background 0.2s; }
        .match-row:hover { background: #f9f9f9; }
        .match-info { width: 45%; position: relative; /* 关键：为弹窗定位 */ }
        .match-id { font-size: 0.85em; color: #888; margin-right: 10px; font-family: monospace; }
        .match-row.tbd { background-color: #f5f5f5; color: #999; opacity: 0.7; }
        .status-finished { color: green; font-weight: bold; background: #e8f5e9; padding: 2px 8px; border-radius: 4px; }
        
        /* --- [修改] 统计条样式 --- */
        .admin-stats-box {
            margin-top: 8px;
            padding: 5px 8px;
            background: #f8f8f8;
            border-radius: 6px;
            border: 1px solid #eee;
            font-size: 0.75rem;
            cursor: pointer; /* 变成手型，提示可点击 */
            transition: background 0.2s;
        }
        .admin-stats-box:hover { background: #f0f0f0; border-color: #ccc; }
        .admin-stats-text { display: flex; justify-content: space-between; margin-bottom: 4px; color: #555; }
        .admin-bar-bg { width: 100%; height: 6px; background: #ddd; border-radius: 3px; overflow: hidden; display: flex; }
        
        /* --- [修改] 详细名单弹窗 (Click to Show) --- */
        .stats-popup {
            display: none; /* 默认隐藏 */
            position: absolute;
            z-index: 1000;
            background-color: white;
            width: 240px;
            max-height: 300px;
            overflow-y: auto; /* 允许滚动 */
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            padding: 10px;
            top: 100%; /* 显示在下方 */
            left: 0;
            margin-top: 5px;
        }
        /* 打开状态 */
        .stats-popup.active { display: block; }
        
        .tooltip-item { 
            display: flex; 
            justify-content: space-between; 
            padding: 4px 0; 
            border-bottom: 1px dashed #eee; 
            font-size: 0.8rem;
        }
        .tooltip-item:last-child { border-bottom: none; }
        .tooltip-item b { color: var(--accent-purple); }

        /* --- 用户管理 & 弹窗 --- */
        .user-row { background: #fdfdfd; padding: 15px; margin-bottom: 10px; border-left: 5px solid var(--accent-purple); border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .user-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px dashed #eee; }
        .user-stats { font-size: 0.9rem; color: #555; }
        .user-achievements { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
        .ach-tag { display: inline-flex; align-items: center; background: #e0d4fc; color: var(--accent-purple); padding: 4px 10px; border-radius: 15px; font-size: 0.85rem; font-weight: bold; }
        .ach-remove { cursor: pointer; color: #ff4d4d; margin-left: 6px; font-weight: bold; font-size: 1.1em; line-height: 1; }
        
        #manual-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:999; backdrop-filter: blur(2px); }
        #manual-form { display:none; position: fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:white; padding:25px; border-radius:15px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); z-index: 1000; width: 320px; border: 2px solid var(--primary-pink); }
        #manual-form h4 { margin-top: 0; color: var(--accent-purple); border-bottom: 1px solid #eee; padding-bottom: 10px; }
        #manual-form label { display: block; margin-top: 10px; font-size: 0.85rem; font-weight: bold; color: #666; }
        #manual-form input, #manual-form select { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ddd; border-radius: 6px; }
        .form-actions { display:flex; gap:10px; margin-top:20px; }
        input[type="number"] { width: 40px; text-align: center; padding: 5px; border: 1px solid #ccc; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="admin-container">
        <h1>👮 OWCS 2026 赛事总控台</h1>

        <div class="section-box">
            <h3 class="section-title">🔄 Liquipedia 同步</h3>
            <div id="sync-status-box" style="font-size:0.85rem; color:#555;">加载中...</div>
            <div style="margin-top:10px; display:flex; gap:8px; flex-wrap:wrap;">
                <button onclick="syncNow()" class="btn-primary">🔄 立即同步</button>
                <button onclick="syncToggle()" id="sync-toggle-btn" style="background:#eee; border:1px solid #ccc; padding:6px 12px; border-radius:5px; cursor:pointer;">暂停/恢复</button>
            </div>
            <div id="sync-diff-box" style="margin-top:12px;"></div>
        </div>

        <div class="section-box">
            <h3 class="section-title">🎯 Bracket 提交开关</h3>
            <div id="bracket-lock-box" style="font-size:0.9rem; color:#555;">加载中...</div>
            <div style="margin-top:12px; display:flex; gap:8px; flex-wrap:wrap;">
                <button onclick="setBracketLock('auto')" id="bl-auto" style="border:1px solid #ccc; background:white; padding:6px 14px; border-radius:5px; cursor:pointer;">⏱ 自动 (按时间)</button>
                <button onclick="setBracketLock('force-unlock')" id="bl-open" style="border:1px solid #ccc; background:white; padding:6px 14px; border-radius:5px; cursor:pointer;">🔓 强制开放</button>
                <button onclick="setBracketLock('force-lock')" id="bl-lock" style="border:1px solid #ccc; background:white; padding:6px 14px; border-radius:5px; cursor:pointer;">🔒 强制锁定</button>
            </div>
        </div>

        <div class="section-box">
            <h3 class="section-title">👥 玩家管理</h3>
            <div style="display:flex; gap:10px; margin-bottom:15px;">
                <input type="text" id="user-search" placeholder="输入昵称..." style="flex:1; padding:10px; border:1px solid #ccc; border-radius:5px;">
                <button onclick="searchUsers()" class="btn-primary">🔍 搜索</button>
            </div>
            <div id="user-results"></div>
        </div>

        <div class="section-box">
            <h3 class="section-title">🎮 比赛管理</h3>
            <p style="font-size:0.8rem; color:#666; margin-bottom:10px;">
                * <b>点击统计条</b> 可展开/收起详细预测名单。<br>
                * 录入结果后自动晋级。
            </p>
            <div id="admin-matches"><div class="loading">加载中...</div></div>
        </div>

        <div class="section-box" style="border-color:red; background:#fff5f5; margin-top:40px;">
            <h3 class="section-title" style="color:red; border-bottom-color:red;">☢️ 危险区域</h3>
            <button onclick="factoryReset()" style="background:red; color:white; border:none; padding:10px 20px; font-weight:bold; cursor:pointer; border-radius:5px; width:100%;">💣 删除所有数据并重置系统</button>
        </div>
    </div>

    <div id="manual-overlay" onclick="closeManual()"></div>
    <div id="manual-form">
        <h4>⚡ 修正分数</h4><p style="margin:0 0 10px 0;font-size:0.9rem;">玩家:<b id="target-user-name"></b></p><input type="hidden" id="target-user-id">
        <label>🎯 应用范围:</label><select id="manual-target-day"><option value="0">仅总分</option><option value="1">Day 1</option><option value="2">Day 2</option><option value="3">Day 3</option><option value="4">Day 4</option><option value="5">Day 5</option></select>
        <label>🔢 分数:</label><input type="number" id="manual-points" style="width:100%;text-align:left;">
        <label>📝 理由:</label><input type="text" id="manual-reason">
        <div class="form-actions"><button onclick="submitManualScore()" class="btn-primary" style="flex:1">提交</button><button onclick="closeManual()" style="flex:1;background:#eee;border:none;cursor:pointer;">取消</button></div>
    </div>

    <script>
        const API = '/api/admin';
        const headers = { 'Content-Type': 'application/json', 'adminSecret': '123456' };

        document.addEventListener('DOMContentLoaded', () => { loadMatches(); loadSyncStatus(); loadBracketLock(); });
        setInterval(loadSyncStatus, 15000);

        let _currentDiffs = [];

        async function loadSyncStatus() {
            try {
                const res = await fetch(API+'/sync-status', {headers});
                const s = await res.json();
                const fmt = (d) => d ? new Date(d).toLocaleString() : '-';
                document.getElementById('sync-status-box').innerHTML = `
                    <div>状态: <b style="color:${s.paused?'red':'green'}">${s.paused?'⏸ 已暂停':'▶ 运行中'}</b> ${s.enabled?'':'(环境变量已禁用)'}</div>
                    <div>高频轮询: ${s.pollHigh/1000}s &nbsp; 低频: ${s.pollLow/1000}s &nbsp; 窗口: ±${s.windowHours}h</div>
                    <div>上次高频: ${fmt(s.lastHighRun)} &nbsp; 上次低频: ${fmt(s.lastLowRun)}</div>
                    <div>连续失败: ${s.consecutiveFailures} ${s.lastError?`<span style="color:red">(${s.lastError})</span>`:''}</div>
                    <div>最近差异条数: <b style="color:${s.lastDiffCount>0?'orange':'#888'}">${s.lastDiffCount}</b></div>`;
                document.getElementById('sync-toggle-btn').innerText = s.paused ? '▶ 恢复' : '⏸ 暂停';
            } catch(e){ document.getElementById('sync-status-box').innerText = '同步状态接口不可用'; }
        }
        async function syncNow(){
            const res = await fetch(API+'/sync-now',{method:'POST',headers});
            const data = await res.json();
            const box = document.getElementById('sync-diff-box');
            if (!data.success) { box.innerHTML = `<div style="color:red">${data.message}</div>`; return; }
            _currentDiffs = data.diffs || [];
            renderDiffs();
            loadSyncStatus();
        }

        function renderDiffs(){
            const box = document.getElementById('sync-diff-box');
            if (!_currentDiffs || _currentDiffs.length === 0) {
                box.innerHTML = '<div style="color:green;">✅ 全部一致，无差异</div>';
                return;
            }
            const escape = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
            const rows = _currentDiffs.map((d, i) => `
                <div id="diff-row-${i}" style="display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px; border:1px solid #eee; border-radius:6px; margin-bottom:6px; background:#fafafa;">
                    <div style="font-size:0.82rem; flex:1; min-width:0;">
                        <b>${escape(d.customId)}</b> · <span style="color:#666">${escape(d.field)}</span><br>
                        <span style="color:#999">本地</span> <b>${escape(JSON.stringify(d.current))}</b>
                        → <span style="color:#999">线上</span> <b style="color:#c00">${escape(JSON.stringify(d.scraped))}</b>
                    </div>
                    <div style="display:flex; gap:6px;">
                        <button onclick="applyDiff(${i})" style="background:var(--primary-pink); color:white; border:none; padding:5px 12px; border-radius:5px; cursor:pointer; font-size:0.8rem;">✓ 同步</button>
                        <button onclick="skipDiff(${i})" style="background:#eee; border:1px solid #ccc; padding:5px 12px; border-radius:5px; cursor:pointer; font-size:0.8rem;">✗ 不同步</button>
                    </div>
                </div>`).join('');
            box.innerHTML = `<b>检测到 ${_currentDiffs.length} 处差异 (逐条选择):</b><div style="margin-top:8px;">${rows}</div>`;
        }

        async function applyDiff(idx){
            const d = _currentDiffs[idx];
            if (!d) return;
            if (!confirm(`确认把 ${d.customId} · ${d.field} 同步为线上值?\n${JSON.stringify(d.scraped)}`)) return;
            const res = await fetch(API+'/apply-diff',{method:'POST',headers,body:JSON.stringify({customId:d.customId, field:d.field, value:d.scraped})});
            const data = await res.json();
            if (!data.success) { alert('同步失败: ' + (data.message || '未知')); return; }
            _currentDiffs.splice(idx, 1);
            renderDiffs();
            loadMatches();
        }

        function skipDiff(idx){
            _currentDiffs.splice(idx, 1);
            renderDiffs();
        }
        async function syncToggle(){
            const btn = document.getElementById('sync-toggle-btn');
            const isPaused = btn.innerText.includes('恢复');
            await fetch(API + (isPaused?'/sync-resume':'/sync-pause'),{method:'POST',headers});
            loadSyncStatus();
        }

        async function loadBracketLock(){
            try {
                const res = await fetch(API+'/bracket-lock', {headers});
                const s = await res.json();
                renderBracketLock(s);
            } catch(e){ document.getElementById('bracket-lock-box').innerText = 'Bracket 锁定接口不可用'; }
        }
        function renderBracketLock(s){
            const modeLabel = { 'auto':'⏱ 自动 (按时间)', 'force-lock':'🔒 强制锁定', 'force-unlock':'🔓 强制开放' }[s.mode] || s.mode;
            const stateColor = s.locked ? '#c00' : '#0a0';
            const stateText  = s.locked ? '🔒 当前: 已锁定 (无法提交)' : '🔓 当前: 已开放 (可提交)';
            document.getElementById('bracket-lock-box').innerHTML = `
                <div>模式: <b>${modeLabel}</b> &nbsp; 时间锁线: <span style="color:#888">${new Date(s.lockTime).toLocaleString()}</span> ${s.dateLocked?'<span style="color:#888">(已过)</span>':''}</div>
                <div style="margin-top:4px;"><b style="color:${stateColor}">${stateText}</b></div>`;
            ['bl-auto','bl-open','bl-lock'].forEach(id => {
                const el = document.getElementById(id);
                if (el) { el.style.background = 'white'; el.style.borderColor = '#ccc'; el.style.fontWeight = 'normal'; }
            });
            const activeId = { 'auto':'bl-auto', 'force-unlock':'bl-open', 'force-lock':'bl-lock' }[s.mode];
            const active = activeId && document.getElementById(activeId);
            if (active) { active.style.background = '#e0d4fc'; active.style.borderColor = 'var(--accent-purple)'; active.style.fontWeight = 'bold'; }
        }
        async function setBracketLock(mode){
            const confirmMsg = mode === 'force-lock' ? '强制锁定后所有玩家无法再提交/更新 Bracket，确认?'
                : mode === 'force-unlock' ? '强制开放后即使过了 M1 时间也允许提交，确认?'
                : '恢复为按时间自动锁定?';
            if (!confirm(confirmMsg)) return;
            const res = await fetch(API+'/bracket-lock',{method:'POST',headers,body:JSON.stringify({mode})});
            const data = await res.json();
            if (!data.success) { alert('设置失败: ' + (data.message || '未知')); return; }
            renderBracketLock(data);
        }

        // 点击页面其他地方关闭所有弹窗
        document.addEventListener('click', function(event) {
            if (!event.target.closest('.admin-stats-box')) {
                document.querySelectorAll('.stats-popup').forEach(el => el.classList.remove('active'));
            }
        });

        async function loadMatches() {
            const [matchesRes, statsRes] = await Promise.all([ fetch('/api/matches'), fetch('/api/predict/stats') ]);
            const matches = await matchesRes.json();
            const stats = await statsRes.json(); 
            const container = document.getElementById('admin-matches');
            container.innerHTML = '';

            matches.forEach(m => {
                const isFin = m.status === 'finished';
                const isLocked = m.isExplicitlyLocked; 
                const tbdA = m.teamA.name === 'TBD', tbdB = m.teamB.name === 'TBD', isTBD = tbdA || tbdB;
                const teamA = tbdA ? m.teamA.displayName : m.teamA.name;
                const teamB = tbdB ? m.teamB.displayName : m.teamB.name;
                const d = new Date(m.startTime);
                const localIso = new Date(d.getTime() - (d.getTimezoneOffset() * 60000)).toISOString().slice(0, 16);

                // 统计数据
                const stat = stats[m._id] || { A: 0, B: 0, total: 0, list: [] };
                const total = stat.total;
                const pctA = total > 0 ? Math.round((stat.A / total) * 100) : 0;
                const pctB = total > 0 ? Math.round((stat.B / total) * 100) : 0;
                
                // [修改] 弹窗式列表 (默认隐藏，点击显示)
                let listHtml = '';
                if (stat.list && stat.list.length > 0) {
                    // 按预测比分排序优化阅读
                    stat.list.sort((a,b) => a.score.localeCompare(b.score));
                    const listItems = stat.list.map(item => 
                        `<div class="tooltip-item"><span>${item.name}</span><b>${item.score}</b></div>`
                    ).join('');
                    listHtml = `<div class="stats-popup" id="popup-${m._id}">${listItems}</div>`;
                } else {
                    listHtml = `<div class="stats-popup" id="popup-${m._id}"><div style="color:#999;text-align:center;">暂无记录</div></div>`;
                }

                let statsHtml = '';
                if (total > 0) {
                    statsHtml = `
                        <div class="admin-stats-box" onclick="toggleStats('${m._id}')" title="点击展开详情">
                            ${listHtml}
                            <div class="admin-stats-text">
                                <span style="color:var(--primary-pink)"><b>${stat.A}</b> 票 (${pctA}%)</span>
                                <span>共 ${total} 人 ▼</span>
                                <span style="color:var(--accent-purple)"><b>${stat.B}</b> 票 (${pctB}%)</span>
                            </div>
                            <div class="admin-bar-bg">
                                <div style="width:${pctA}%; background:var(--primary-pink);"></div>
                                <div style="width:${pctB}%; background:var(--accent-purple);"></div>
                            </div>
                        </div>
                    `;
                } else {
                    statsHtml = `<div class="admin-stats-box" style="color:#aaa; text-align:center; cursor:default;">(暂无预测)</div>`;
                }

                // 控件
                let controlHtml = isTBD ? `<span style="font-size:0.8rem; color:#aaa;">🔒 等待晋级</span>` :
                    (isFin ? `<span class="status-finished">✅ ${m.teamA.score}:${m.teamB.score}</span> <button onclick="resetMatch('${m._id}')" style="margin-left:5px;border:none;background:none;cursor:pointer;">❌</button>` :
                    `<input type="number" id="sA_${m._id}" value="${m.teamA.score}" min="0" max="4">:<input type="number" id="sB_${m._id}" value="${m.teamB.score}" min="0" max="4"><button onclick="settleMatch('${m._id}')" class="btn-primary" style="padding:2px 8px;font-size:0.8rem;margin-left:5px;">确认</button>`);
                
                const lockBtn = (!isTBD && !isFin) ? `<button onclick="toggleLock('${m._id}')" style="margin-left:15px; border:1px solid #ddd; background:${isLocked ? '#ffeba7' : 'white'}; padding:5px 10px; border-radius:5px; cursor:pointer;">${isLocked ? '🔒' : '🔓'}</button>` : '';

                container.innerHTML += `
                    <div class="${isTBD?'match-row tbd':'match-row'}">
                        <div class="match-info">
                            <span class="match-id">${m.customId}</span> <b>${teamA}</b> vs <b>${teamB}</b>
                            <div style="margin-top:8px; display:flex; align-items:center; gap:5px;">
                                <input type="datetime-local" id="time_${m._id}" value="${localIso}" style="font-size:0.75rem; padding:2px; width:135px; border:1px solid #ddd; color:#666;">
                                <button onclick="updateTime('${m._id}')" style="font-size:0.7rem; padding:2px 6px; background:#f0f0f0; border:1px solid #ccc; cursor:pointer;">🕒 更新</button>
                            </div>
                            ${statsHtml}
                        </div>
                        <div style="display:flex; align-items:center;">${controlHtml}${lockBtn}</div>
                    </div>`;
            });
        }

        // [新增] 切换弹窗显示
        function toggleStats(matchId) {
            const popup = document.getElementById(`popup-${matchId}`);
            if(!popup) return;
            
            const isActive = popup.classList.contains('active');
            // 先关闭所有
            document.querySelectorAll('.stats-popup').forEach(el => el.classList.remove('active'));
            
            // 如果之前没打开，现在打开
            if (!isActive) popup.classList.add('active');
        }

        async function updateTime(matchId) {
            const input = document.getElementById(`time_${matchId}`);
            if (!input.value) return alert("时间不能为空");
            const isoTime = new Date(input.value).toISOString();
            if (!confirm(`确认修改时间?`)) return;
            await fetch(API + '/update-time', { method: 'POST', headers, body: JSON.stringify({ matchId, newStartTime: isoTime }) });
            alert("时间已更新");
        }

        async function settleMatch(id) {
            const sA=document.getElementById(`sA_${id}`).value, sB=document.getElementById(`sB_${id}`).value;
            if(!confirm(`确认 ${sA}:${sB}?`))return;
            await fetch(API+'/settle',{method:'POST',headers,body:JSON.stringify({matchId:id,scoreA:sA,scoreB:sB})}); loadMatches();
        }
        async function resetMatch(id){
            if(!confirm('撤销该场结算?\n(若下游比赛已结算将一并级联撤销)')) return;
            const res = await fetch(API+'/reset-match',{method:'POST',headers,body:JSON.stringify({matchId:id})});
            const data = await res.json();
            if (!data.success) { alert('撤销失败: ' + (data.message || '未知错误')); return; }
            if (data.revoked && data.revoked.length > 1) {
                alert(`已撤销 ${data.revoked.length} 场比赛:\n${data.revoked.join(' → ')}`);
            }
            loadMatches();
        }
        async function toggleLock(id){ const res=await fetch(API+'/toggle-lock',{method:'POST',headers,body:JSON.stringify({matchId:id})}); if((await res.json()).success) loadMatches(); }
        async function factoryReset(){ if(prompt("输入 DELETE 确认:")==='DELETE'){ await fetch(API+'/factory-reset',{method:'POST',headers,body:JSON.stringify({confirmation:'DELETE'})}); location.reload(); } }
        async function searchUsers(){ const q=document.getElementById('user-search').value; const res=await fetch(API+`/search-users?q=${q}`,{headers}); renderUsers(await res.json()); }
        function renderUsers(users){
            const escape = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
            const c = document.getElementById('user-results');
            c.innerHTML = users.map(u => `
            <div class="user-row" data-uid="${u._id}" data-nick="${escape(u.nickname)}">
                <div class="user-header">
                    <div>
                        <span style="font-size:1.1rem; font-weight:bold;">${escape(u.nickname)}</span>
                        <span style="color:#666; font-size:0.85rem;">实时 ${u.totalScore||0} / Bracket ${u.bracketScore||0}</span>
                    </div>
                    <div>
                        <button data-act="bracket" style="margin-right:5px;">🎯 看Bracket</button>
                        <button data-act="manual" style="margin-right:5px;">⚡ 修正</button>
                        <button data-act="delete" style="background:#ffe5e5; border:1px solid #ff8a8a; color:#c00; cursor:pointer;">🗑 删除</button>
                    </div>
                </div>
            </div>`).join('');
            c.querySelectorAll('button[data-act]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const row = btn.closest('.user-row');
                    const uid = row.dataset.uid;
                    const nick = row.dataset.nick;
                    const act = btn.dataset.act;
                    if (act === 'bracket') viewBracket(uid, nick);
                    else if (act === 'manual') openManual(uid, nick);
                    else if (act === 'delete') deleteUser(uid, nick);
                });
            });
        }
        async function deleteUser(uid, name){
            const input = prompt(`⚠️ 删除 ${name} 将一并删除其所有预测和 Bracket，不可恢复！\n请输入完整昵称 "${name}" 以确认:`);
            if (input === null) return;
            if (input !== name) { alert('昵称不匹配，已取消'); return; }
            const res = await fetch(API+'/delete-user',{method:'POST',headers,body:JSON.stringify({userId:uid, confirmNickname:name})});
            const data = await res.json();
            if (!data.success) { alert('删除失败: ' + (data.message || '未知')); return; }
            alert(data.message || '已删除');
            searchUsers();
        }
        async function viewBracket(uid, name){
            const res = await fetch(`/api/bracket/my/${uid}`);
            const data = await res.json();
            if (!data || !data.picks || data.picks.length === 0) { alert(`${name} 未提交 Bracket`); return; }
            const lines = data.picks.map(p => `${p.matchCustomId}: ${p.teamAName} ${p.teamAScore}-${p.teamBScore} ${p.teamBName} → ${p.predictedWinner}`);
            alert(`${name} 的 Bracket\n提交时间: ${new Date(data.submittedAt).toLocaleString()}\n当前分: ${data.bracketScore}\n\n${lines.join('\n')}`);
        }
        function openManual(id,name){ document.getElementById('manual-overlay').style.display='block'; document.getElementById('manual-form').style.display='block'; document.getElementById('target-user-name').innerText=name; document.getElementById('target-user-id').value=id; }
        function closeManual(){ document.getElementById('manual-overlay').style.display='none'; document.getElementById('manual-form').style.display='none'; }
        async function submitManualScore(){ 
            const id=document.getElementById('target-user-id').value, pts=document.getElementById('manual-points').value, r=document.getElementById('manual-reason').value, d=document.getElementById('manual-target-day').value;
            await fetch(API+'/manual-score',{method:'POST',headers,body:JSON.stringify({userId:id,points:pts,reason:r,targetDay:d})}); closeManual(); searchUsers();
        }
    </script>
</body>
</html>
