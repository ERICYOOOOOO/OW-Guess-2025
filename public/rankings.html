<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>排行榜 - OWCS 2026 Champions Clash</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        /* 排行榜页面专用样式 */
        .rank-header {
            text-align: center;
            padding: 48px 20px 40px;
            background:
                radial-gradient(ellipse at top, rgba(255,182,193,0.4), transparent 60%),
                linear-gradient(180deg, var(--surface) 0%, var(--soft-pink-bg) 100%);
            border-bottom: 1px solid var(--border-soft);
            margin-bottom: 32px;
            position: relative;
        }
        .rank-header::after {
            content: '';
            position: absolute;
            bottom: -1px; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--primary-pink), var(--accent-purple), var(--primary-pink), transparent);
        }
        .rank-header h1 {
            font-weight: 800;
            font-size: 2rem;
            margin: 0 0 8px;
            letter-spacing: -0.3px;
        }

        .rank-tabs {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 32px;
            padding: 0 16px;
        }

        .tab-btn {
            background: var(--surface);
            border: 1.5px solid var(--primary-pink);
            color: var(--primary-pink);
            padding: 9px 22px;
            border-radius: var(--radius-pill);
            cursor: pointer;
            font-weight: 700;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: var(--shadow-sm);
        }

        .tab-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
        .tab-btn.active { background: var(--primary-pink); color: white; box-shadow: var(--shadow-pink); }

        .day-selector-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--surface);
            padding: 6px;
            border-radius: var(--radius-pill);
            border: 1px solid var(--border-soft);
            box-shadow: var(--shadow-sm);
        }

        #rank-day-select {
            padding: 8px 16px;
            border-radius: var(--radius-pill);
            border: 1.5px solid var(--accent-purple);
            color: var(--accent-purple);
            font-weight: 700;
            outline: none;
            cursor: pointer;
            background-color: var(--surface);
            transition: all 0.15s;
        }

        #rank-day-select:hover { background-color: var(--surface-tint); }

        /* 表格容器样式 */
        .leaderboard-table {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            border-collapse: collapse;
            background: var(--surface);
            border-radius: var(--radius-md);
            overflow: hidden;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-soft);
        }

        .leaderboard-table th {
            background: linear-gradient(135deg, var(--accent-purple) 0%, #6b1aa8 100%);
            color: white;
            padding: 16px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
        }
        .leaderboard-table td { padding: 14px; text-align: center; border-bottom: 1px solid var(--border-soft); color: #3a3a42; }
        .leaderboard-table tr:last-child td { border-bottom: none; }
        .leaderboard-table tr:hover { background-color: var(--surface-tint); }

        .achievement-icon { font-size: 1.4rem; margin: 0 4px; cursor: help; transition: transform 0.2s; display: inline-block; }
        .achievement-icon:hover { transform: scale(1.3); }
        .loading { text-align: center; padding: 40px; color: var(--accent-purple); font-weight: bold; font-size: 1.2rem; }

        /* [新增] 截图水印样式 (平时隐藏) */
        #export-watermark {
            display: none; /* 平时隐藏 */
            text-align: center;
            padding-bottom: 20px;
            background: white; 
        }
        #export-watermark h2 { margin: 0; font-size: 1.2rem; color: var(--accent-purple); letter-spacing: 2px; }
        #export-watermark h1 { margin: 5px 0; font-size: 2.5rem; color: var(--primary-pink); text-shadow: 2px 2px 0px #eee; }
        #export-watermark h3 { margin: 0; font-size: 1rem; color: #666; font-weight: normal; background: #f0f0f0; display: inline-block; padding: 2px 15px; border-radius: 20px; }

        /* [新增] 截图容器 (用于包裹水印和表格) */
        #capture-area {
            background: white;
            padding: 20px;
            border-radius: 15px;
            max-width: 900px;
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">OWCS 2026 CHAMPIONS CLASH</div>
        <div class="menu">
            <a href="index.html">主页</a>
            <a href="predict.html">实时预测</a>
            <a href="bracket.html">Bracket</a>
            <a href="rankings.html" class="active">排行榜</a>
        </div>
        <div id="user-display" class="user-info"></div>
    </nav>

    <header class="rank-header">
        <h1 style="font-size: 2.5rem; color: var(--text-dark); margin: 0;">🏆 预测大神榜</h1>
        <p style="color: #666; margin-top: 10px; font-size: 1.1rem;">
            看看谁才是新皇后街的👑终极预测王👑
        </p>
    </header>

    <div class="rank-tabs">
        <button class="tab-btn active" onclick="switchTab('total')">
            <i class="fas fa-crown"></i> 合并榜
        </button>
        <button class="tab-btn" onclick="switchTab('bracket')">
            <i class="fas fa-sitemap"></i> Bracket 榜
        </button>
    </div>

    <div id="capture-wrapper" style="padding: 0 10px;">
        <div id="capture-area">
            
            <div id="export-watermark">
                <h2>新皇后街居委会</h2>
                <h1>游戏理解 s2</h1>
                <h3 id="export-subtitle">总积分榜</h3>
            </div>

            <div id="rank-container">
                <div class="loading">正在拉取排名数据...</div>
            </div>
        </div>
    </div>

    <div style="text-align:center; margin: 40px 0 60px;">
        <button onclick="downloadImage()" class="btn-primary" style="font-size:1.2rem; padding:12px 40px; border-radius:50px; box-shadow:0 8px 20px rgba(255,105,180,0.3); border:none;">
            📸 生成榜单图片
        </button>
    </div>

    <footer>
        <p>OWCS 2026 Champions Clash Prediction Game · 新皇后街居委会</p>
    </footer>

    <script src="js/client.js"></script>
    <script src="js/rankings.js"></script>
</body>
</html>
