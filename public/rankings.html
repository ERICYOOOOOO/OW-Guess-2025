<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>排行榜 - OWCS 2026 Champions Clash</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        /* 排行榜页面专用样式 */
        .rank-header {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, var(--soft-pink-bg) 0%, #fff 100%);
            border-bottom: 5px solid var(--primary-pink);
            margin-bottom: 30px;
        }

        .rank-tabs {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
            padding: 0 10px;
        }

        .tab-btn {
            background: white;
            border: 2px solid var(--primary-pink);
            color: var(--primary-pink);
            padding: 10px 25px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .tab-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(255, 105, 180, 0.2); }
        .tab-btn.active { background: var(--primary-pink); color: white; box-shadow: 0 4px 15px rgba(255, 105, 180, 0.4); }

        .day-selector-wrapper {
            display: flex;
            align-items: center;
            gap: 5px;
            background: white;
            padding: 5px;
            border-radius: 50px;
            border: 1px solid #eee;
        }

        #rank-day-select {
            padding: 8px 15px;
            border-radius: 20px;
            border: 2px solid var(--accent-purple);
            color: var(--accent-purple);
            font-weight: bold;
            outline: none;
            cursor: pointer;
            background-color: #fdfdfd;
        }
        
        #rank-day-select:hover { background-color: #f0f0f0; }

        /* 表格容器样式 */
        .leaderboard-table {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            border-collapse: collapse;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .leaderboard-table th { background: var(--accent-purple); color: white; padding: 18px; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1px; }
        .leaderboard-table td { padding: 15px; text-align: center; border-bottom: 1px solid #f0f0f0; color: #444; }
        .leaderboard-table tr:last-child td { border-bottom: none; }
        .leaderboard-table tr:hover { background-color: #fff0f5; }

        .achievement-icon { font-size: 1.4rem; margin: 0 4px; cursor: help; transition: transform 0.2s; display: inline-block; }
        .achievement-icon:hover { transform: scale(1.3); }
        .loading { text-align: center; padding: 40px; color: var(--accent-purple); font-weight: bold; font-size: 1.2rem; }

        /* [新增] 截图水印样式 (平时隐藏) */
        #export-watermark {
            display: none; /* 平时隐藏 */
            text-align: center;
            padding-bottom: 20px;
            background: white; 
        }
        #export-watermark h2 { margin: 0; font-size: 1.2rem; color: var(--accent-purple); letter-spacing: 2px; }
        #export-watermark h1 { margin: 5px 0; font-size: 2.5rem; color: var(--primary-pink); text-shadow: 2px 2px 0px #eee; }
        #export-watermark h3 { margin: 0; font-size: 1rem; color: #666; font-weight: normal; background: #f0f0f0; display: inline-block; padding: 2px 15px; border-radius: 20px; }

        /* [新增] 截图容器 (用于包裹水印和表格) */
        #capture-area {
            background: white;
            padding: 20px;
            border-radius: 15px;
            max-width: 900px;
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">OWCS 2026 CHAMPIONS CLASH</div>
        <div class="menu">
            <a href="index.html">主页</a>
            <a href="predict.html">实时预测</a>
            <a href="bracket.html">Bracket</a>
            <a href="rankings.html" class="active">排行榜</a>
        </div>
        <div id="user-display" class="user-info"></div>
    </nav>

    <header class="rank-header">
        <h1 style="font-size: 2.5rem; color: var(--text-dark); margin: 0;">🏆 预测大神榜</h1>
        <p style="color: #666; margin-top: 10px; font-size: 1.1rem;">
            看看谁才是新皇后街的👑终极预测王👑
        </p>
    </header>

    <div class="rank-tabs">
        <button class="tab-btn active" onclick="switchTab('total')">
            <i class="fas fa-crown"></i> 合并榜
        </button>
        <button class="tab-btn" onclick="switchTab('bracket')">
            <i class="fas fa-sitemap"></i> Bracket 榜
        </button>
    </div>

    <div id="capture-wrapper" style="padding: 0 10px;">
        <div id="capture-area">
            
            <div id="export-watermark">
                <h2>新皇后街居委会</h2>
                <h1>英杰预测王</h1>
                <h3 id="export-subtitle">总积分榜</h3>
            </div>

            <div id="rank-container">
                <div class="loading">正在拉取排名数据...</div>
            </div>
        </div>
    </div>

    <div style="text-align:center; margin: 40px 0 60px;">
        <button onclick="downloadImage()" class="btn-primary" style="font-size:1.2rem; padding:12px 40px; border-radius:50px; box-shadow:0 8px 20px rgba(255,105,180,0.3); border:none;">
            📸 生成榜单图片
        </button>
    </div>

    <footer>
        <p>OWCS 2026 Champions Clash Prediction Game · 新皇后街居委会</p>
    </footer>

    <script src="js/client.js"></script>
    <script src="js/rankings.js"></script>
</body>
</html>
