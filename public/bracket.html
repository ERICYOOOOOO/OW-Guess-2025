<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bracket 预测 - OWCS 2026 Champions Clash</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .bracket-page {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px 20px;
        }
        .bracket-header {
            text-align: center;
            margin-bottom: 24px;
        }
        .lock-banner {
            background: linear-gradient(135deg, #fff5f9, #fff0f5);
            border: 1px solid rgba(255,105,180,0.3);
            border-radius: var(--radius-md);
            padding: 14px 18px;
            margin: 16px 0;
            color: var(--accent-purple);
            text-align: center;
            font-weight: 600;
            box-shadow: var(--shadow-sm);
        }
        .lock-banner.locked {
            background: linear-gradient(135deg, #fff5f5, #ffe8e8);
            border-color: rgba(220,53,69,0.3);
            color: #c92b3b;
        }
        .bracket-round {
            margin: 32px 0 12px;
        }
        .bracket-round h3 {
            color: var(--accent-purple);
            font-weight: 800;
            font-size: 1.15rem;
            padding-bottom: 8px;
            position: relative;
            margin-bottom: 16px;
        }
        .bracket-round h3::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0;
            width: 50px; height: 3px;
            background: linear-gradient(90deg, var(--primary-pink), var(--accent-purple));
            border-radius: 2px;
        }
        .bracket-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 14px;
        }
        .bracket-card {
            background: var(--surface);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius-md);
            padding: 14px;
            box-shadow: var(--shadow-sm);
            transition: all 0.25s ease;
        }
        .bracket-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }
        .bracket-card.picked {
            border-color: var(--primary-pink);
            box-shadow: var(--shadow-pink);
        }
        .bracket-card.unresolved {
            opacity: 0.55;
        }
        .bracket-card.locked-by-dep {
            background: #fafafa;
        }
        .bc-head {
            display: flex;
            justify-content: space-between;
            font-size: 0.78rem;
            color: #888;
            margin-bottom: 6px;
        }
        .bc-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 4px;
            border-radius: 6px;
        }
        .bc-row.win { background: rgba(75,0,130,0.06); }
        .bc-team {
            flex: 1;
            font-weight: bold;
            font-size: 0.95rem;
            color: var(--text-dark);
        }
        .bc-team .placeholder { color: #999; font-weight: normal; font-style: italic; }
        .bc-score {
            width: 60px;
            display: flex;
            align-items: center;
            gap: 2px;
        }
        .bc-score input[type=number] {
            width: 38px;
            text-align: center;
            font-size: 1rem;
            font-weight: 900;
            color: var(--accent-purple);
            border: 1px solid var(--light-pink);
            border-radius: 5px;
            padding: 3px;
        }
        .bc-pick-btn {
            background: var(--surface-tint);
            color: var(--accent-purple);
            border: 1px solid var(--border-soft);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 700;
            transition: all 0.15s;
        }
        .bc-pick-btn:hover { background: var(--primary-pink); color: white; border-color: var(--primary-pink); }
        .bc-pick-btn.active { background: var(--accent-purple); color: white; border-color: var(--accent-purple); }
        .bc-pick-btn:disabled { background: #f5f5f7; color: #c4c4cb; cursor: not-allowed; border-color: var(--border-soft); }
        .bc-clear {
            background: transparent;
            border: 1px dashed #ccc;
            color: #888;
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 6px;
        }
        .bc-clear:hover { background: #fbe7e7; color: #d9534f; border-color: #d9534f; }
        .bc-clear:disabled { opacity: 0.4; cursor: not-allowed; }
        .bc-msg {
            font-size: 0.72rem;
            color: #d9534f;
            margin-top: 4px;
            min-height: 1em;
        }
        /* === 结算后特效 === */
        @keyframes bracket-rainbow-glow {
            0%   { border-color: #ff0000; box-shadow: 0 0 16px rgba(255, 0, 0, 0.55); }
            15%  { border-color: #ff00ff; box-shadow: 0 0 16px rgba(255, 0, 255, 0.55); }
            30%  { border-color: #0000ff; box-shadow: 0 0 16px rgba(0, 0, 255, 0.55); }
            45%  { border-color: #00ffff; box-shadow: 0 0 16px rgba(0, 255, 255, 0.55); }
            60%  { border-color: #00ff00; box-shadow: 0 0 16px rgba(0, 255, 0, 0.55); }
            75%  { border-color: #ffff00; box-shadow: 0 0 16px rgba(255, 255, 0, 0.55); }
            90%  { border-color: #ff8000; box-shadow: 0 0 16px rgba(255, 128, 0, 0.55); }
            100% { border-color: #ff0000; box-shadow: 0 0 16px rgba(255, 0, 0, 0.55); }
        }
        .bracket-card.status-correct {
            border-left: 5px solid var(--status-correct);
            background: linear-gradient(to right, #f0fdf4, #ffffff);
        }
        .bracket-card.status-wrong {
            border-left: 5px solid var(--status-wrong);
            background: linear-gradient(to right, #fef2f2, #ffffff);
            opacity: 0.85;
        }
        .bracket-card.status-perfect {
            animation: bracket-rainbow-glow 3s linear infinite;
            border-width: 2px;
            border-style: solid;
            background: linear-gradient(135deg, #fff9fc, #fffbe6);
            transform: scale(1.015);
            position: relative;
            z-index: 2;
        }
        .bracket-card.status-invalid {
            border-left: 5px solid #9ca3af;
            background: #fafafa;
            opacity: 0.7;
        }
        .bc-result {
            margin-top: 8px;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.82rem;
            font-weight: 600;
            text-align: center;
            background: rgba(0,0,0,0.03);
        }
        .bc-result.correct { background: rgba(34,197,94,0.10); color: #15803d; }
        .bc-result.wrong   { background: rgba(239,68,68,0.10); color: #b91c1c; }
        .bc-result.perfect { background: linear-gradient(90deg, #fff5d6, #ffe9f0); color: #b8860b; }
        .bc-result.invalid { background: rgba(156,163,175,0.15); color: #4b5563; }
        .bc-result .real-score { color: var(--accent-purple); font-weight: 800; }
        .submit-bar {
            position: sticky;
            bottom: 14px;
            background: var(--surface);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius-pill);
            padding: 12px 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 24px;
            box-shadow: var(--shadow-lg);
            backdrop-filter: blur(8px);
        }
        .progress-text { font-weight: 700; color: var(--accent-purple); }
        .submit-bar button {
            background: var(--primary-pink);
            color: white;
            border: none;
            padding: 10px 26px;
            border-radius: var(--radius-pill);
            font-weight: 700;
            cursor: pointer;
            font-size: 0.95rem;
            box-shadow: var(--shadow-pink);
            transition: all 0.2s;
        }
        .submit-bar button:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 10px 22px rgba(255,105,180,0.32);
        }
        .submit-bar button:disabled {
            background: #d4d4dc;
            cursor: not-allowed;
            box-shadow: none;
        }
        .timezone-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            font-size: 0.75rem;
            color: #666;
            margin-top: 4px;
            flex-wrap: wrap;
        }
        .timezone-row span b { color: var(--accent-purple); }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="logo">OWCS 2026 CHAMPIONS CLASH</div>
    <div class="menu">
        <a href="index.html">主页</a>
        <a href="predict.html">实时预测</a>
        <a href="bracket.html" class="active">Bracket</a>
        <a href="rankings.html">排行榜</a>
    </div>
    <div id="user-display" class="user-info"></div>
</nav>

<div id="login-modal" class="modal-overlay" style="display:none;">
    <div class="modal-content">
        <h2>🔐 身份验证</h2>
        <p>请先在【实时预测】页面登录后再来填 Bracket。</p>
        <a href="predict.html" class="btn-primary" style="display:inline-block; text-decoration:none;">去登录</a>
    </div>
</div>

<div class="bracket-page">
    <div class="bracket-header">
        <h1 style="color:var(--accent-purple); margin-bottom:5px;">🎯 我的 Bracket</h1>
        <p style="color:#666; margin:0;">一次性预测全部 14 场。M1 开赛即锁定，不可修改。</p>
        <div id="lock-banner" class="lock-banner">⏳ 加载中...</div>
    </div>

    <div id="bracket-content">
        <div style="text-align:center; padding:40px; color:#999;">加载中...</div>
    </div>

    <div id="submit-bar" class="submit-bar" style="display:none;">
        <div>
            <div class="progress-text" id="progress-text">已填 0 / 14</div>
            <div style="font-size:0.75rem; color:#999;">提交后无法修改</div>
        </div>
        <button id="submit-btn" disabled onclick="submitBracket()">提交 Bracket</button>
    </div>
</div>

<script src="js/client.js"></script>
<script src="js/bracket.js"></script>

</body>
</html>
